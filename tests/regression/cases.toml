# Regression test cases.
#
# Each [[case]] entry points at a slide on disk. Tests skip cleanly when
# `path` is missing, so this file is safe to commit.
#
# Paths may be absolute or relative to the repo root.
# Override location: export WSINSIGHT_REGRESSION_CASES=/path/to/cases.toml
#
# Per-slide golden outputs live under tests/regression/fixtures/<slide_id>/
# and are produced by scripts/regenerate_regression_baselines.py.

[[case]]
slide_id = "TCGA-BR-8591"
path     = "tests/cases/TCGA-BR-8591-01Z-00-DX1.c64ee000-b80d-46dd-b347-7aa8ce3b6113.svs"
expected_appmag = 40.0
expected_mpp    = 0.252
mpp_atol        = 0.005

[[case]]
slide_id = "TCGA-D7-A6F2"
path     = "tests/cases/TCGA-D7-A6F2-01Z-00-DX1.31D8B3CD-7F63-474F-9B1B-E884C4CA9C61.svs"
expected_appmag = 40.0
expected_mpp    = 0.2527

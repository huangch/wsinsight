pluginManagement {
    plugins {
        id 'org.bytedeco.gradle-javacpp-platform' version '1.5.9'
        id 'org.openjfx.javafxplugin' version '0.1.0'
    }
}

rootProject.name = 'qupath-extension-wsinsight'

// QuPath version pinned for v0.1 of the WSInsight QuPath extension.
gradle.ext.qupathVersion = '0.7.0'

dependencyResolutionManagement {
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url 'https://maven.scijava.org/content/repositories/releases' }
        maven { url 'https://maven.scijava.org/content/repositories/snapshots' }
    }

    versionCatalogs {
        libs {
            from("io.github.qupath:qupath-catalog:${gradle.ext.qupathVersion}")
        }
    }
}

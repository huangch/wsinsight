[build-system]
requires = ["setuptools<67", "setuptools_scm[toml]>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wsinsight"
description = "Run patch-based classification on pathology whole slide images."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache License, Version 2.0" }
authors = [
  { name = "WSInsight Team" },
]
maintainers = [
  { name = "WSInsight Team" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
# Version is dynamic via setuptools-scm (use tags). Keep only the hard compatibility rule here.
dependencies = [
  # "anndata>=0.11,<0.12",  # 0.11 works with zarr 2.x; squidpy/spatialdata-io need anndata.io
  "anndata>=0.11,<0.13",  # 0.11 works with zarr 2.x; squidpy/spatialdata-io need anndata.io
  "click>=8.0,<9,!=8.1.4,!=8.1.5",
  "h5py",
  "numpy<2.0.0",
  "opencv-python-headless>=4.0.0",
  "orjson>=3.9.0",
  "pandas>=2.0",
  "pillow>=10.0",
  "scikit-image>=0.20.0",
  "scikit-learn",
  "shapely>=2.0",
  "tifffile>=2023.1.23",
  "tiffslide>=2.2.0",
  "imagecodecs>=2023.7.10 ; python_version>='3.9'",
  "tqdm",

  # ML stacks (kept unpinned except minimals where WSInfer template had them),
  # so they resolve their own compat. Users bring their CUDA toolkit.
  "torch>=1.7",
  "torchvision",
  "torch-geometric",
  "timm",
  "tensorflow",
  "keras",
  "stardist",
  "nvidia-ml-py",

  # Storage / cloud
  "s3fs",
  "gcsfs",
  "boto3",
  "platformdirs",
  "joblib",
  "lz4",  # required by joblib.dump(compress=("lz4", ...)) in niche_generation

  # Graph & clustering
  "igraph",
  "leidenalg",
  "pynndescent",  # approximate kNN for the niche Leiden/kNN connectivity graph

  # Geospatial Python layer (users install GDAL themselves first)
  "geopandas",
  "pyproj",
  "rasterio",
  "pyogrio",

  # Pathology / WSI ecosystem
  "openslide-python",
  "wsidicom",

  # QuPath integration
  "paquo",

  # Model zoo
  "wsinfer-zoo>=0.6.2",

  # HistomicsTK runtime dependencies.
  # NOTE: histomicstk itself is a pre-install step in conda-setup.sh / Dockerfiles.
  # It hardpins girder-client==3.2.11 which is broken on PyPI (2026-06); see
  # constraints.txt for the pinned working replacement (girder-client==5.0.10).
  # All its transitive deps are declared here so `pip install -e .` satisfies them
  # before the `pip install --no-deps histomicstk` pre-step runs.
  "scipy",
  "nimfa",
  "imageio",
  "sqlalchemy",
  "ctk-cli",
  "girder-slicer-cli-web",
  "girder-client",
  "dask[dataframe]<2024.11.0",
  "distributed",

  # large-image (histomicstk integration layer)
  # Pre-installed from the girder wheel index for pre-built wheels; `pip install -e .`
  # sees them as already satisfied and skips the PyPI fallback.
  "pyvips",
  "large-image",
  "large-image-source-tifffile",
  "large-image-source-pil",
  "large-image-source-openslide",
  "large-image-source-vips",
  "large-image-converter",

  # Additional runtime dependencies
  "pexpect",
  "huggingface_hub[hf_transfer]",
]
dynamic = ["version"]

[project.optional-dependencies]
docs = [
  "sphinx",
  "pydata-sphinx-theme",
  "sphinx-autoapi",
  "sphinx-click",
  "sphinx-copybutton",
]
mcp = [
  "fastmcp>=2.0",
]

[project.urls]
Homepage = "https://wsinsight.readthedocs.io"
Documentation = "https://wsinsight.readthedocs.io"
Repository = "https://github.com/huangch/wsinsight"
BugTracker = "https://github.com/huangch/wsinsight/issues"

[project.scripts]
wsinsight = "wsinsight.__main__:main"
wsinsight-mcp = "wsinsight.mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["wsinsight*"]

[tool.setuptools.package-data]
wsinsight = ["py.typed", "schemas/*.json"]

[tool.setuptools_scm]
write_to = "wsinsight/_version.py"
fallback_version = "0.1.0"
# default version/local scheme is fine; tag your release as `v0.1.0` or `0.1.0`

[tool.mypy]
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "h5py",
  "anndata",
  "geojson",
  "torchvision.*",
  "openslide",
  "shapely.*",
  "zarr.storage",
]
ignore_missing_imports = true

[tool.ruff]
extend-exclude = ["_version.py", "scripts/"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
unfixable = ["B"]

[tool.ruff.lint.isort]
force-single-line = true 

